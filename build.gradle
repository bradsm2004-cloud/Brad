plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bsmith.customstopwatch'
    compileSdk 35

    defaultConfig {
        applicationId "com.bsmith.customstopwatch"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
